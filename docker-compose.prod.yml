# docker-compose.prod.yml — Production stack
#
# Full production setup: Caddy reverse-proxies both the built frontend static
# files and PocketBase API/realtime behind a single HTTPS domain.
#
# Prerequisites:
#   1. Build the frontend first: cd frontend && pnpm build
#      (output lands in frontend/dist/, which Caddy serves as static files)
#   2. Create a .env file at the repo root with at least:
#        DOMAIN=your-subdomain.example.com
#        VAPID_PUBLIC_KEY=...
#        VAPID_PRIVATE_KEY=...
#        VAPID_SUBJECT=mailto:you@example.com
#   3. Ensure ./backend/pb_data/ exists and is writable on the host
#
# This file will be fully integrated with automated VPS deployment in F7.
# Until then, deploy manually:
#   docker compose -f docker-compose.prod.yml up -d
#
# See ARCHITECTURE.md §8 for the full deployment runbook.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Built frontend static files — produced by `pnpm build` in ./frontend/
      - ./frontend/dist:/srv/frontend:ro
      # Caddy persists TLS certificates in caddy_data; losing this volume
      # forces a new ACME challenge (rate-limited — keep this volume safe)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocketbase
    environment:
      - DOMAIN

  pocketbase:
    build:
      context: ./backend
      args:
        PB_VERSION: "0.23.4"
    restart: unless-stopped
    # PocketBase is NOT exposed to the host in prod — only Caddy reaches it
    # via the internal Docker network on port 8090.
    volumes:
      - ./backend/pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations:ro
      - ./backend/pb_hooks:/pb/pb_hooks:ro
    environment:
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      - PUSH_SERVICE_URL=http://push-service:3001
      - PUSH_SERVICE_TOKEN

  # push-service — Web Push dispatcher (F6)
  # Not exposed to the host — only Caddy and PocketBase reach it via Docker network.
  push-service:
    build:
      context: ./backend/push-service
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      - PUSH_SERVICE_TOKEN
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_TOKEN

volumes:
  caddy_data:
  caddy_config:
